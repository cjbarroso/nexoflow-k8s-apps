apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
spec:
  project: operators
  sources:
  - repoURL: https://helm.strrl.dev
    chart: cloudflare-tunnel-ingress-controller
    targetRevision: 0.0.23
    helm:
      valueFiles:
      - $values/src/cloudflared/values.yaml
  - repoURL: 'https://github.com/cjbarroso/nexoflow-k8s-apps.git'
    targetRevision: master
    ref: values
  # Applies the namespace Vault stack (CA/Connection/Auth) plus the
  # VaultStaticSecret for the Cloudflare credentials; the chart reads them via
  # cloudflare.secretRef (see the values file). Filtered because values.yaml
  # and README.md live in the same directory and aren't manifests.
  - repoURL: 'https://github.com/cjbarroso/nexoflow-k8s-apps.git'
    targetRevision: master
    path: src/cloudflared
    directory:
      include: 'vault-secrets.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
