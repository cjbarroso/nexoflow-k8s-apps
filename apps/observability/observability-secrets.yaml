# Applies the raw SealedSecret(s) for the observability stack from
# src/observability/. The placeholder template is excluded so Argo never
# applies it; *.json is excluded too — Grafana dashboard source exports live
# in this dir for reference, and the directory source would otherwise try to
# parse them as manifests and fail the whole app (no `Kind`). Until
# grafana-secrets-sealedsecret.yaml exists, this app syncs empty and the
# Grafana pod stays Pending on the missing `grafana-secrets` Secret — that's
# expected (see src/observability/README sealing steps).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-secrets
  namespace: argocd
spec:
  project: support
  source:
    repoURL: https://github.com/cjbarroso/nexoflow-k8s-apps.git
    path: src/observability
    targetRevision: master
    directory:
      recurse: false
      # Single glob with brace alternation: Argo v2.14 compiles `exclude`
      # as ONE pattern (no comma-separated lists), so both masks go in braces.
      exclude: '*.{example.yaml,json}'
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
