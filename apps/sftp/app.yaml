apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sftp
  namespace: argocd
spec:
  project: sftp
  source:
    repoURL: 'https://github.com/cjbarroso/nexoflow-k8s-apps.git'
    path: src/sftp
    targetRevision: master
    directory:
      recurse: false
      exclude: '*.example.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: sftp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
