name: Build Hermes test sandbox

on:
  push:
    branches: [master]
    paths:
      - src/hermes2/test-sandbox/**
      - .github/workflows/build-hermes-test-sandbox.yml
  pull_request:
    paths:
      - src/hermes2/test-sandbox/**
      - .github/workflows/build-hermes-test-sandbox.yml

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: src/hermes2/test-sandbox
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/hermes-test-sandbox:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/hermes-test-sandbox:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
