# Vault-sourced secrets for the PAMI downloader (VSO migration batch 3).
#
# Replaces the former SealedSecret `pami-downloader-secrets`: VSO materializes
# a plain Secret with the SAME name and keys that pami-downloader-cronjob.yaml
# consumes via secretKeyRef (PAMI_USER, PAMI_PASSWORD). No rolloutRestartTargets:
# CronJob pods read env at each run.
#
# The Google Drive credential remains a SealedSecret on purpose (separate
# trust domain, different rotation cadence): pami-downloader-gdrive.sealedsecret.yaml.
#
# Data lives in Vault KV v2 at nexoflow/pami/downloader. Auth is per-namespace
# (Kubernetes auth role `pami` bound to SA default in ns pami; policy pami-ro =
# read on nexoflow/data/pami/*).
#
# The CA cert is PUBLIC material (cert-manager cluster CA from
# src/vault/tls.yaml) â€” safe to commit; see docs/10-VAULT-RUNBOOK.md.
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-ca
  namespace: pami
type: Opaque
data:
  ca.crt: 
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: default
  namespace: pami
spec:
  address: https://vault-active.vault.svc.cluster.local:8200
  caCertSecretRef: vault-ca
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: pami
  namespace: pami
spec:
  method: kubernetes
  mount: kubernetes
  # Explicit ref required by VSO 1.5.0 (allow-default-globals): without it the
  # lookup fails with "VaultConnection default not found". See runbook.
  vaultConnectionRef: default
  kubernetes:
    role: pami
    serviceAccount: default
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: pami-downloader-secrets
  namespace: pami
spec:
  type: kv-v2
  mount: nexoflow
  path: pami/downloader
  refreshAfter: 1h
  vaultAuthRef: pami
  destination:
    name: pami-downloader-secrets
    create: true
