# Vault-sourced secrets for monica (VSO migration batch 2).
#
# Replaces the former SealedSecret `monica-secrets`: VSO materializes a plain
# Secret with the SAME name and keys that deployment.yaml / mariadb.yaml /
# db-backup-cronjob.yaml consume via secretKeyRef.
#
# Data lives in Vault KV v2 at nexoflow/monica/monica. Auth is per-namespace
# (Kubernetes auth role `monica` bound to SA default in ns monica; policy
# monica-ro = read on nexoflow/data/monica/*).
#
# The CA cert is PUBLIC material (cert-manager cluster CA from
# src/vault/tls.yaml) â€” safe to commit; see docs/10-VAULT-RUNBOOK.md.
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-ca
  namespace: monica
type: Opaque
data:
  ca.crt: 
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: default
  namespace: monica
spec:
  address: https://vault-active.vault.svc.cluster.local:8200
  caCertSecretRef: vault-ca
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: monica
  namespace: monica
spec:
  method: kubernetes
  mount: kubernetes
  # Explicit ref required by VSO 1.5.0 (allow-default-globals): without it the
  # lookup fails with "VaultConnection default not found". See runbook.
  vaultConnectionRef: default
  kubernetes:
    role: monica
    serviceAccount: default
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: monica-secrets
  namespace: monica
spec:
  type: kv-v2
  mount: nexoflow
  path: monica/monica
  refreshAfter: 1h
  vaultAuthRef: monica
  destination:
    name: monica-secrets
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: monica
    - kind: StatefulSet
      name: monica-db
