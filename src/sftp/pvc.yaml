apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sftp-data
  namespace: sftp
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      # 1 GiB is the smallest practical Longhorn volume and is ample for the
      # single-user, sub-megabyte file drop.
      storage: 1Gi
