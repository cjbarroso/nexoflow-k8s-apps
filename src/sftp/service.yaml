apiVersion: v1
kind: Service
metadata:
  name: sftp
  namespace: sftp
  labels:
    app: sftp
spec:
  # Power Automate cannot run a cloudflared client-side proxy. The router
  # forwards public TCP/22 to this NodePort on a cluster node.
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app: sftp
  ports:
    - name: ssh
      protocol: TCP
      port: 22
      targetPort: ssh
      nodePort: 30222
