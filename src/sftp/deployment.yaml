# The upload service is intentionally small and stateless; the PVC is the only
# persistent state and remains mounted at /data across pod recreation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sftp
  namespace: sftp
  labels:
    app: sftp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sftp
  template:
    metadata:
      labels:
        app: sftp
        logs.cjbarroso.com/collect: "true"
    spec:
      serviceAccountName: sftp
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sftp-data
        - name: upload-server
          configMap:
            name: sftp-upload-server
            defaultMode: 0444
      containers:
        - name: upload-server
          image: python:3.13.7-alpine3.22@sha256:9ba6d8cbebf0fb6546ae71f2a1c14f6ffd2fdab83af7fa5669734ef30ad48844
          imagePullPolicy: IfNotPresent
          command: [python, /app/server.py]
          env:
            - name: UPLOAD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sftp-credentials
                  key: UPLOAD_TOKEN
            - name: UPLOAD_DIR
              value: /data/upload
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: upload-server
              mountPath: /app
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
