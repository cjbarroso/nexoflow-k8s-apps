apiVersion: v1
kind: ConfigMap
metadata:
  name: sftp-upload-server
  namespace: sftp
data:
  server.py: |
    from __future__ import annotations

    import hmac
    import json
    import os
    import tempfile
    from http import HTTPStatus
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from pathlib import Path
    from urllib.parse import urlsplit


    MAX_UPLOAD_SIZE = 1024 * 1024
    MAX_FILENAME_BYTES = 255
    DATA_DIR = Path(os.environ.get("UPLOAD_DIR", "/data/upload"))
    UPLOAD_TOKEN = os.environ.get("UPLOAD_TOKEN", "")


    def json_bytes(payload: dict[str, object]) -> bytes:
        """Encode a response payload without adding unnecessary whitespace."""
        return json.dumps(payload, separators=(",", ":")).encode("utf-8")


    class UploadHandler(BaseHTTPRequestHandler):
        """Handle the health endpoint and authenticated file uploads."""

        protocol_version = "HTTP/1.1"
        server_version = "upload-service"
        sys_version = ""

        def do_GET(self) -> None:
            """Return health status without exposing the upload directory."""
            if urlsplit(self.path).path == "/healthz":
                self.send_json(HTTPStatus.OK, {"status": "ok"})
                return
            self.send_json(HTTPStatus.NOT_FOUND, {"error": "not found"})

        def do_POST(self) -> None:
            """Authenticate and atomically store one request body."""
            # Rejected requests return before consuming their body. Closing the
            # connection prevents leftover bytes from becoming a new request.
            self.close_connection = True
            if urlsplit(self.path).path != "/upload":
                self.send_json(HTTPStatus.NOT_FOUND, {"error": "not found"})
                return

            if not self.authorized():
                self.send_json(
                    HTTPStatus.UNAUTHORIZED,
                    {"error": "unauthorized"},
                    {"WWW-Authenticate": "Bearer"},
                )
                return

            filename = self.headers.get("X-Filename")
            if filename is None or not self.valid_filename(filename):
                self.send_json(
                    HTTPStatus.BAD_REQUEST,
                    {"error": "X-Filename must be one safe filename"},
                )
                return

            content_length_text = self.headers.get("Content-Length")
            if (
                content_length_text is None
                or not content_length_text.isascii()
                or not content_length_text.isdigit()
            ):
                self.close_connection = True
                self.send_json(
                    HTTPStatus.LENGTH_REQUIRED,
                    {"error": "Content-Length is required"},
                )
                return

            content_length = int(content_length_text)
            if content_length > MAX_UPLOAD_SIZE:
                self.discard_body(min(content_length, MAX_UPLOAD_SIZE + 1))
                self.close_connection = True
                self.send_json(
                    HTTPStatus.REQUEST_ENTITY_TOO_LARGE,
                    {"error": "file exceeds the 1 MiB limit"},
                )
                return

            if self.headers.get("Transfer-Encoding"):
                self.close_connection = True
                self.send_json(
                    HTTPStatus.BAD_REQUEST,
                    {"error": "chunked transfer encoding is not supported"},
                )
                return

            destination = DATA_DIR / filename
            temporary_path: Path | None = None
            try:
                file_descriptor, temporary_name = tempfile.mkstemp(
                    prefix=".upload-",
                    suffix=".tmp",
                    dir=DATA_DIR,
                )
                temporary_path = Path(temporary_name)
                with os.fdopen(file_descriptor, "wb") as temporary_file:
                    remaining = content_length
                    while remaining:
                        chunk = self.rfile.read(min(64 * 1024, remaining))
                        if not chunk:
                            raise EOFError("request body ended before Content-Length")
                        temporary_file.write(chunk)
                        remaining -= len(chunk)
                    temporary_file.flush()
                    os.fsync(temporary_file.fileno())

                # Linking first prevents overwriting an existing file and makes
                # the completed upload visible as one atomic directory change.
                os.link(temporary_path, destination)
                temporary_path.unlink()
                temporary_path = None
            except FileExistsError:
                self.send_json(
                    HTTPStatus.CONFLICT,
                    {"error": "a file with that name already exists"},
                )
                return
            except EOFError:
                self.close_connection = True
                self.send_json(
                    HTTPStatus.BAD_REQUEST,
                    {"error": "request body ended before Content-Length"},
                )
                return
            except OSError:
                self.close_connection = True
                self.send_json(
                    HTTPStatus.INTERNAL_SERVER_ERROR,
                    {"error": "could not store the file"},
                )
                return
            finally:
                if temporary_path is not None:
                    temporary_path.unlink(missing_ok=True)

            self.send_json(
                HTTPStatus.CREATED,
                {"filename": filename, "bytes": content_length},
            )

        def do_PUT(self) -> None:
            """Reject methods that could otherwise be mistaken for uploads."""
            self.method_not_allowed()

        def do_PATCH(self) -> None:
            """Reject methods that could otherwise be mistaken for uploads."""
            self.method_not_allowed()

        def do_DELETE(self) -> None:
            """Prevent the endpoint from becoming a file deletion API."""
            self.method_not_allowed()

        def authorized(self) -> bool:
            """Check a bearer token without leaking timing information."""
            scheme, separator, token = self.headers.get(
                "Authorization", ""
            ).partition(" ")
            return (
                bool(UPLOAD_TOKEN)
                and separator == " "
                and scheme.lower() == "bearer"
                and hmac.compare_digest(token, UPLOAD_TOKEN)
            )

        @staticmethod
        def valid_filename(filename: str) -> bool:
            """Allow one ordinary filename and reject path/control characters."""
            if not filename or filename != filename.strip():
                return False
            if (
                filename in {".", ".."}
                or len(filename.encode("utf-8")) > MAX_FILENAME_BYTES
            ):
                return False
            return not any(
                character in "/\\\x00\r\n" or ord(character) < 32 or ord(character) == 127
                for character in filename
            )

        def method_not_allowed(self) -> None:
            """Return a JSON response for unsupported write methods."""
            self.close_connection = True
            self.send_json(
                HTTPStatus.METHOD_NOT_ALLOWED,
                {"error": "method not allowed"},
                {"Allow": "GET, POST"},
            )

        def discard_body(self, length: int) -> None:
            """Drain only the bounded prefix needed before rejecting a request."""
            remaining = length
            while remaining:
                chunk = self.rfile.read(min(64 * 1024, remaining))
                if not chunk:
                    break
                remaining -= len(chunk)

        def send_json(
            self,
            status: HTTPStatus,
            payload: dict[str, object],
            extra_headers: dict[str, str] | None = None,
        ) -> None:
            """Send a bounded JSON response with explicit framing."""
            body = json_bytes(payload)
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.send_header("Cache-Control", "no-store")
            if self.close_connection:
                self.send_header("Connection", "close")
            if extra_headers:
                for name, value in extra_headers.items():
                    self.send_header(name, value)
            self.end_headers()
            self.wfile.write(body)


    def main() -> None:
        """Validate runtime configuration and serve the upload endpoint."""
        if not UPLOAD_TOKEN:
            raise RuntimeError("UPLOAD_TOKEN must be set")
        DATA_DIR.mkdir(parents=True, exist_ok=True)
        server = ThreadingHTTPServer(("0.0.0.0", 8080), UploadHandler)
        server.serve_forever()


    if __name__ == "__main__":
        main()
