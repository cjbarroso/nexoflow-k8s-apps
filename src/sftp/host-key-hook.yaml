apiVersion: v1
kind: ConfigMap
metadata:
  name: sftp-host-key-hook
  namespace: sftp
data:
  persist-host-keys.sh: |
    #!/bin/sh
    set -eu

    key_dir=/persistent/.ssh-host-keys
    mkdir -p "$key_dir"
    chmod 700 "$key_dir"

    for key_name in \
      ssh_host_ed25519_key \
      ssh_host_ed25519_key.pub \
      ssh_host_rsa_key \
      ssh_host_rsa_key.pub; do
      current_key="/etc/ssh/$key_name"
      saved_key="$key_dir/$key_name"

      if [ -f "$saved_key" ]; then
        cp "$saved_key" "$current_key"
      else
        cp "$current_key" "$saved_key"
      fi
    done

    chmod 600 \
      /etc/ssh/ssh_host_ed25519_key \
      /etc/ssh/ssh_host_rsa_key \
      "$key_dir/ssh_host_ed25519_key" \
      "$key_dir/ssh_host_rsa_key"
    chmod 644 \
      /etc/ssh/ssh_host_ed25519_key.pub \
      /etc/ssh/ssh_host_rsa_key.pub \
      "$key_dir/ssh_host_ed25519_key.pub" \
      "$key_dir/ssh_host_rsa_key.pub"
