metadata:
  name: planka-data-2g
  namespace: planka
  labels:
    app.kubernetes.io/instance: planka
    app.kubernetes.io/name: planka
    app.kubernetes.io/component: data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
