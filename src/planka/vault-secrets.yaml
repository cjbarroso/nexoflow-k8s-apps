# Vault-sourced secrets for planka (Vault Secrets Operator pilot).
#
# Replaces the former SealedSecret `planka-admin`: VSO materializes a plain
# Secret with the SAME name and keys (username, password) that the chart's
# existingAdminCredsSecret consumes, so the Deployment is unchanged.
#
# Data lives in Vault KV v2 at nexoflow/planka/admin. Auth is per-namespace
# (Kubernetes auth role `planka` bound to SA default in ns planka; policy
# planka-ro = read on nexoflow/data/planka/*).
#
# The CA cert below is PUBLIC material (cert-manager self-signed cluster CA
# from src/vault/tls.yaml) â€” safe to commit. Each consuming namespace carries
# its own copy so VSO can verify vault-active's TLS without copying the
# server keypair.
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-ca
  namespace: planka
type: Opaque
data:
  ca.crt: 
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: default
  namespace: planka
spec:
  address: https://vault-active.vault.svc.cluster.local:8200
  caCertSecretRef: vault-ca
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: planka
  namespace: planka
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: planka
    serviceAccount: default
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: planka-admin
  namespace: planka
spec:
  type: kv-v2
  mount: nexoflow
  path: planka/admin
  refreshAfter: 1h
  vaultAuthRef: planka
  dest:
    name: planka-admin
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: planka
