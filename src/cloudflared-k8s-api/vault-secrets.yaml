# Vault-sourced tunnel credentials for cloudflared-k8s-api (VSO migration
# batch 4). The namespace stack (vault-ca / VaultConnection / VaultAuth) lives
# in src/cloudflared/vault-secrets.yaml — same namespace, shared VaultAuth.
#
# credentials.json is volume-mounted by deployment.yaml (secretName below).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudflared-k8s-api-creds
  namespace: cloudflared
spec:
  type: kv-v2
  mount: nexoflow
  path: cloudflared/k8s-api-creds
  refreshAfter: 1h
  vaultAuthRef: cloudflared
  destination:
    name: cloudflared-k8s-api-creds
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: cloudflared-k8s-api
