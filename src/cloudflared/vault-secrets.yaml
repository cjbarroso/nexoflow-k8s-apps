# Vault-sourced secrets for the cloudflared namespace (VSO migration batch 4).
#
# This namespace hosts THREE workloads from three separate Argo apps
# (src/cloudflared, src/cloudflared-k8s-api, src/cloudflared-mssql). The
# namespace stack (CA + Connection + Auth) lives HERE; the other two apps'
# vault-secrets.yaml files only add VaultStaticSecret entries that reference
# this VaultAuth.
#
# Data lives in Vault KV v2 at nexoflow/cloudflared/*. Auth is per-namespace
# (Kubernetes auth role `cloudflared` bound to SA default in ns cloudflared;
# policy cloudflared-ro = read on nexoflow/data/cloudflared/*).
#
# The CA cert is PUBLIC material (cert-manager cluster CA from
# src/vault/tls.yaml) â€” safe to commit; see docs/10-VAULT-RUNBOOK.md.
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-ca
  namespace: cloudflared
type: Opaque
data:
  ca.crt: 
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: default
  namespace: cloudflared
spec:
  address: https://vault-active.vault.svc.cluster.local:8200
  caCertSecretRef: vault-ca
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  method: kubernetes
  mount: kubernetes
  # Explicit ref required by VSO 1.5.0 (allow-default-globals): without it the
  # lookup fails with "VaultConnection default not found". See runbook.
  vaultConnectionRef: default
  kubernetes:
    role: cloudflared
    serviceAccount: default
    audiences:
      - vault
---
# Cloudflare API token/account/tunnel for the tunnel connector and the ingress
# controller (chart secretRef in src/cloudflared/values.yaml).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudflare-api-credentials
  namespace: cloudflared
spec:
  type: kv-v2
  mount: nexoflow
  path: cloudflared/api-credentials
  refreshAfter: 1h
  vaultAuthRef: cloudflared
  destination:
    name: cloudflare-api-credentials
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: controlled-cloudflared-connector
    - kind: Deployment
      name: cloudflared-cloudflare-tunnel-ingress-controller
