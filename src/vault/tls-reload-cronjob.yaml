# TLS certificate reload for the Vault cluster.
#
# WHY THIS EXISTS
# `src/vault/tls.yaml` issues the Vault server certificate for 30 days with a
# 5-day renewBefore window, so cert-manager rewrites the `vault-tls` Secret
# roughly every 25 days. Vault reads `tls_cert_file` only when the process
# starts and then keeps that certificate in memory; kubelet keeps the mounted
# file fresh (atomic symlink swap), but nothing ever tells Vault to re-read it.
#
# Result without this Job: after every rotation the pods keep serving the
# PREVIOUS certificate until that one expires, and then every client that
# verifies TLS breaks at once — the snapshot CronJob (`FATAL: vault login
# failed`), the Vault Secrets Operator, and anything else authenticating
# against Vault. In September 2026 that went unnoticed for 19 days. It cannot
# be fixed by simply restarting the pods either: this cluster is sealed with
# Shamir (3 of 5), so a restart leaves every Vault pod SEALED until a human
# supplies the unseal keys.
#
# WHAT IT DOES
# Twice a day, compare each Vault pod's live TLS leaf with the certificate in
# the vault-tls Secret. When they differ, confirm kubelet has mounted the new
# certificate before sending SIGHUP, then verify it on the live listener.
# Vault reloads in place. Confirmed reloads are recorded in the
# vault-tls-reload-history ConfigMap.
#
# Reference: "Vault SIGHUP Behavior" (HashiCorp/IBM) —
# https://www.ibm.com/support/pages/vault-sighup-behavior
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-tls-reloader
  namespace: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-tls-reloader
  namespace: vault
rules:
  # Read the desired certificate.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["vault-tls"]
    verbs: ["get"]
  # Enumerate the Vault pods so new replicas are covered automatically.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Read the mounted certificate back out of a running Vault pod.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # Record what was reloaded and when.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-tls-reloader
  namespace: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-tls-reloader
subjects:
  - kind: ServiceAccount
    name: vault-tls-reloader
    namespace: vault
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-tls-reload
  namespace: vault
spec:
  # Far tighter than the ~30 day rotation window, and a no-op whenever the
  # Vault pods already hold the current certificate.
  #
  # Explicit hour values, NOT "17 */12 * * *": on this k3s cluster a step in
  # the HOUR field never runs. Verified 2026-09-29 — a CronJob with
  # "17 */12 * * *" was never scheduled once (no lastScheduleTime, no Jobs, no
  # controller error) while "0 22,23 * * *" and every existing CronJob fired
  # normally. A schedule that silently never runs is worse than no schedule,
  # so keep this form and re-test after any k3s upgrade.
  schedule: "17 5,17 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: vault-tls-reload
        spec:
          serviceAccountName: vault-tls-reloader
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reload
              # Provides kubectl and curl with %{certs} support.
              image: alpine/k8s:1.33.4
              env:
                - name: KUBERNETES_SERVICE_HOST
                  value: kubernetes.default.svc.cluster.local
                - name: KUBERNETES_SERVICE_PORT
                  value: "443"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu -o pipefail

                  NS=vault
                  SECRET=vault-tls
                  CERT=/vault/userconfig/vault-tls/tls.crt
                  HISTORY=vault-tls-reload-history
                  reloaded=0
                  failed=0

                  leaf_pem() {
                    awk '
                      /-----BEGIN CERTIFICATE-----/ { copying = 1; sub(/^.*-----BEGIN/, "-----BEGIN") }
                      copying { print }
                      /-----END CERTIFICATE-----/ && copying { complete = 1; exit }
                      END { if (!complete) exit 1 }
                    '
                  }

                  read_listener() {
                    # Inspect even an expired certificate. This probe sends no
                    # credentials and checks the exact leaf against the Secret.
                    curl --silent --show-error --insecure --noproxy '*' \
                      --max-time 5 --output /dev/null --write-out '%{certs}' \
                      "https://$1.vault-internal:8200/v1/sys/health" > /tmp/peer.txt &&
                    leaf_pem < /tmp/peer.txt > /tmp/served.crt
                  }

                  kubectl -n "$NS" get secret "$SECRET" -o jsonpath='{.data.tls\.crt}' \
                    | base64 -d | leaf_pem > /tmp/desired.crt
                  pods=$(kubectl -n "$NS" get pods \
                           -l app.kubernetes.io/name=vault,component=server \
                           -o jsonpath='{.items[*].metadata.name}')
                  [ -n "$pods" ] || { echo "FATAL: no Vault server pods found"; exit 1; }

                  for pod in $pods; do
                    if ! read_listener "$pod"; then
                      echo "ERROR: could not read the live listener certificate on $pod"
                      failed=$((failed + 1))
                      continue
                    fi
                    if cmp -s /tmp/desired.crt /tmp/served.crt; then
                      echo "OK: $pod serves the current certificate"
                      continue
                    fi

                    if ! kubectl -n "$NS" exec "$pod" -c vault -- cat "$CERT" \
                           | leaf_pem > /tmp/mounted.crt ||
                       ! cmp -s /tmp/desired.crt /tmp/mounted.crt; then
                      echo "ERROR: $pod has not mounted the current certificate"
                      failed=$((failed + 1))
                      continue
                    fi

                    echo "Reloading the listener certificate on $pod"
                    if ! kubectl -n "$NS" exec "$pod" -c vault -- \
                           /bin/sh -c 'kill -HUP "$(pidof vault)"'; then
                      echo "ERROR: could not signal the Vault process in $pod"
                      failed=$((failed + 1))
                      continue
                    fi

                    verified=false
                    for attempt in 1 2 3 4 5; do
                      sleep 2
                      if read_listener "$pod" && cmp -s /tmp/desired.crt /tmp/served.crt; then
                        verified=true
                        break
                      fi
                    done
                    if [ "$verified" = true ]; then
                      echo "OK: $pod serves the current certificate after SIGHUP"
                      reloaded=$((reloaded + 1))
                    else
                      echo "ERROR: $pod did not serve the current certificate after SIGHUP"
                      failed=$((failed + 1))
                    fi
                  done

                  # Leave an audit trail across pod lifetimes. A failed attempt
                  # here must not invalidate the reload that already happened.
                  if [ "$reloaded" -ne 0 ]; then
                    kubectl -n "$NS" create configmap "$HISTORY" \
                      --from-literal="last-reload=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                      --from-literal="pods-reloaded=$reloaded" \
                      --dry-run=client -o yaml | kubectl apply -f - \
                      || echo "WARN: could not record the reload in $HISTORY"
                  fi

                  if [ "$failed" -ne 0 ]; then
                    echo "FATAL: current listener certificate could not be verified on $failed Vault pod(s)"
                    exit 1
                  fi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: kubernetes-api-token
                  mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: kubernetes-api-token
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      expirationSeconds: 3600
                      audience: https://kubernetes.default.svc.cluster.local
                  - configMap:
                      name: kube-root-ca.crt
                      items:
                        - key: ca.crt
                          path: ca.crt
                  - downwardAPI:
                      items:
                        - path: namespace
                          fieldRef:
                            fieldPath: metadata.namespace
            - name: tmp
              emptyDir: {}
