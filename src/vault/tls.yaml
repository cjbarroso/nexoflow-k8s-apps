# A private CA keeps Vault traffic encrypted without exposing an external
# hostname. Distribute only the generated `ca.crt` to client namespaces; never
# copy the `vault-tls` Secret because it also contains the server private key.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vault-selfsigned
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-ca
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  isCA: true
  commonName: vault-cluster-ca
  secretName: vault-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: vault-selfsigned
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vault-ca
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  ca:
    secretName: vault-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-server
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretName: vault-tls
  duration: 720h
  renewBefore: 120h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
    - client auth
  dnsNames:
    - vault
    - vault.vault
    - vault.vault.svc
    - vault.vault.svc.cluster.local
    - vault-active
    - vault-active.vault
    - vault-active.vault.svc
    - vault-active.vault.svc.cluster.local
    - vault-standby
    - vault-standby.vault
    - vault-standby.vault.svc
    - vault-standby.vault.svc.cluster.local
    - vault-internal
    - vault-internal.vault
    - vault-internal.vault.svc
    - vault-internal.vault.svc.cluster.local
    - vault-0.vault-internal
    - vault-0.vault-internal.vault
    - vault-0.vault-internal.vault.svc
    - vault-0.vault-internal.vault.svc.cluster.local
    - vault-1.vault-internal
    - vault-1.vault-internal.vault
    - vault-1.vault-internal.vault.svc
    - vault-1.vault-internal.vault.svc.cluster.local
    - vault-2.vault-internal
    - vault-2.vault-internal.vault
    - vault-2.vault-internal.vault.svc
    - vault-2.vault-internal.vault.svc.cluster.local
  issuerRef:
    name: vault-ca
    kind: Issuer
    group: cert-manager.io
