# Vault namespace's own VSO stack — used by the Raft snapshot backup CronJob.
#
# The rclone-r2 Secret (R2 S3 credentials for uploading snapshots) is
# materialized by VSO from KV v2 at nexoflow/vault/r2-creds.
#
# Reuses the existing cert-manager `vault-ca` Secret (src/vault/tls.yaml) as
# the connection CA — it already carries the public ca.crt key.
#
# Auth: Kubernetes role `vault-snapshot` (policy raft-snapshot = read+sudo on
# sys/storage/raft/snapshot ONLY) bound to SA vault-snapshot in this namespace.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: default
  namespace: vault
spec:
  address: https://vault-active.vault.svc.cluster.local:8200
  caCertSecretRef: vault-ca
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-snapshot
  namespace: vault
spec:
  method: kubernetes
  mount: kubernetes
  # Explicit ref required by VSO 1.5.0 (allow-default-globals): without it the
  # lookup fails with "VaultConnection default not found". See runbook.
  vaultConnectionRef: default
  kubernetes:
    role: vault-snapshot
    serviceAccount: vault-snapshot
    audiences:
      - vault
---
# R2 credentials for snapshot upload. Values live ONLY in Vault KV v2 — never
# commit them. Consumed by the snapshot CronJob via env vars.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: rclone-r2
  namespace: vault
spec:
  type: kv-v2
  mount: nexoflow
  path: vault/r2-creds
  refreshAfter: 1h
  vaultAuthRef: vault-snapshot
  destination:
    name: rclone-r2
    create: true
