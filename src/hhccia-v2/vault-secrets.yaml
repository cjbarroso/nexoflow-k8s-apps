# Vault-sourced secrets for hhccia-v2 (PRODUCTION â€” VSO migration batch 4).
#
# Replaces the six former SealedSecrets; data lives in Vault KV v2 at
# nexoflow/hhccia-v2/*. Auth is per-namespace (Kubernetes auth role `hhccia-v2`
# bound to SA default; policy hhccia-v2-ro = read on nexoflow/data/hhccia-v2/*).
#
# Consumers:
# - core-secrets: hhccia-core, hhccia-adapter-datatech, export cronjobs
# - prestaciones-ui-oidc + prestaciones-ui-gdrive: hhccia-prestaciones-ui
# - prestaciones-export-db: prestaciones export cronjob/fetch
# - db-app: CNPG Cluster bootstrap (postgres.yaml)
# - db-backup-creds: CNPG barman ObjectStore
#
# The CA cert is PUBLIC material (cert-manager cluster CA from
# src/vault/tls.yaml) â€” safe to commit; see docs/10-VAULT-RUNBOOK.md.
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-ca
  namespace: hhccia-v2
type: Opaque
data:
  ca.crt: 
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: default
  namespace: hhccia-v2
spec:
  address: https://vault-active.vault.svc.cluster.local:8200
  caCertSecretRef: vault-ca
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: hhccia-v2
  namespace: hhccia-v2
spec:
  method: kubernetes
  mount: kubernetes
  # Explicit ref required by VSO 1.5.0 (allow-default-globals): without it the
  # lookup fails with "VaultConnection default not found". See runbook.
  vaultConnectionRef: default
  kubernetes:
    role: hhccia-v2
    serviceAccount: default
    audiences:
      - vault
---
# CNPG bootstrap credentials.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: hhccia-core-db-app
  namespace: hhccia-v2
spec:
  type: kv-v2
  mount: nexoflow
  path: hhccia-v2/db-app
  refreshAfter: 1h
  vaultAuthRef: hhccia-v2
  destination:
    name: hhccia-core-db-app
    create: true
---
# S3/R2 credentials for CNPG backups.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: hhccia-core-db-backup-creds
  namespace: hhccia-v2
spec:
  type: kv-v2
  mount: nexoflow
  path: hhccia-v2/db-backup-creds
  refreshAfter: 1h
  vaultAuthRef: hhccia-v2
  destination:
    name: hhccia-core-db-backup-creds
    create: true
---
# Main app secrets (DB url, Gemini key, MSSQL, Authentik API token).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: hhccia-core-secrets
  namespace: hhccia-v2
spec:
  type: kv-v2
  mount: nexoflow
  path: hhccia-v2/core-secrets
  refreshAfter: 1h
  vaultAuthRef: hhccia-v2
  destination:
    name: hhccia-core-secrets
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: hhccia-core
    - kind: Deployment
      name: hhccia-adapter-datatech
---
# MSSQL credentials for the prestaciones export pipeline.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: hhccia-prestaciones-export-db
  namespace: hhccia-v2
spec:
  type: kv-v2
  mount: nexoflow
  path: hhccia-v2/prestaciones-export-db
  refreshAfter: 1h
  vaultAuthRef: hhccia-v2
  destination:
    name: hhccia-prestaciones-export-db
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: hhccia-prestaciones-export-fetch
---
# Google Drive service-account key, volume-mounted in prestaciones-ui.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: hhccia-prestaciones-ui-gdrive
  namespace: hhccia-v2
spec:
  type: kv-v2
  mount: nexoflow
  path: hhccia-v2/prestaciones-ui-gdrive
  refreshAfter: 1h
  vaultAuthRef: hhccia-v2
  destination:
    name: hhccia-prestaciones-ui-gdrive
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: hhccia-prestaciones-ui
---
# OIDC client + session secret for prestaciones-ui.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: hhccia-prestaciones-ui-oidc
  namespace: hhccia-v2
spec:
  type: kv-v2
  mount: nexoflow
  path: hhccia-v2/prestaciones-ui-oidc
  refreshAfter: 1h
  vaultAuthRef: hhccia-v2
  destination:
    name: hhccia-prestaciones-ui-oidc
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: hhccia-prestaciones-ui
