# Exposes the v2 frontend via the Cloudflare tunnel.
#   - medaudit.cjbarroso.com  (cjbarroso.com zone)
# The cloudflared ingress controller creates the DNS CNAME for this host. The
# Angular SPA derives its OIDC redirect from window.location.origin, so this
# host's /callback must be allowlisted in the Authentik provider blueprint
# (src/authentik/blueprints.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hhccia-front-ingress
  namespace: hhccia-v2
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: "medaudit.cjbarroso.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hhccia-front
                port:
                  number: 8080
