# Vault-sourced secrets for hermes2 (VSO migration batch 4).
#
# Replaces the four former SealedSecrets; data lives in Vault KV v2 at
# nexoflow/hermes2/*. Auth is per-namespace (Kubernetes auth role `hermes2`
# bound to SA default in ns hermes2; policy hermes2-ro = read on
# nexoflow/data/hermes2/*).
#
# NOTE: hhccia-machine-creds (app-password) has NO consumer in any manifest â€”
# it is kept in Vault for manual/ops use. Delete both here and in Vault if it
# turns out to be truly orphaned.
#
# The CA cert is PUBLIC material (cert-manager cluster CA from
# src/vault/tls.yaml) â€” safe to commit; see docs/10-VAULT-RUNBOOK.md.
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-ca
  namespace: hermes2
type: Opaque
data:
  ca.crt: 
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: default
  namespace: hermes2
spec:
  address: https://vault-active.vault.svc.cluster.local:8200
  caCertSecretRef: vault-ca
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: hermes2
  namespace: hermes2
spec:
  method: kubernetes
  mount: kubernetes
  # Explicit ref required by VSO 1.5.0 (allow-default-globals): without it the
  # lookup fails with "VaultConnection default not found". See runbook.
  vaultConnectionRef: default
  kubernetes:
    role: hermes2
    serviceAccount: default
    audiences:
      - vault
---
# Alertmanager -> incident webhook trust (WEBHOOK_SECRET + bearer).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: alertmanager-incident-webhook
  namespace: hermes2
spec:
  type: kv-v2
  mount: nexoflow
  path: hermes2/incident-webhook
  refreshAfter: 1h
  vaultAuthRef: hermes2
  destination:
    name: alertmanager-incident-webhook
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: alertmanager-incident-webhook
---
# Cognee Postgres password.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cognee-postgres
  namespace: hermes2
spec:
  type: kv-v2
  mount: nexoflow
  path: hermes2/cognee-postgres
  refreshAfter: 1h
  vaultAuthRef: hermes2
  destination:
    name: cognee-postgres
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: cognee-postgres
---
# LLM API key consumed by the cognee workloads.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: hermes2-cognee-openai
  namespace: hermes2
spec:
  type: kv-v2
  mount: nexoflow
  path: hermes2/cognee-openai
  refreshAfter: 1h
  vaultAuthRef: hermes2
  destination:
    name: hermes2-cognee-openai
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: cognee-backend
    - kind: Deployment
      name: cognee-mcp
    - kind: Deployment
      name: cognee-readonly-mcp
---
# Orphaned credentials kept for ops use â€” see header note.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: hhccia-machine-creds
  namespace: hermes2
spec:
  type: kv-v2
  mount: nexoflow
  path: hermes2/machine-creds
  refreshAfter: 1h
  vaultAuthRef: hermes2
  destination:
    name: hhccia-machine-creds
    create: true
