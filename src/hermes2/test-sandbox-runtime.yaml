# Persistent remote terminal target for Hermes tool execution.
#
# This workload is deliberately separate from the Hermes Deployment and never
# mounts hermes2-data. The SSH key Secret is created out-of-band; do not add it
# to this repository. Tool configuration, gcloud auth state, host keys, and
# /workspace live on PVCs and survive pod restarts.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes2-test-sandbox
  namespace: hermes2
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes2-test-sandbox-config
  namespace: hermes2
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes2-test-sandbox-workspace
  namespace: hermes2
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes2-test-sandbox
  namespace: hermes2
  labels:
    app: hermes2-test-sandbox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes2-test-sandbox
  template:
    metadata:
      labels:
        app: hermes2-test-sandbox
        logs.cjbarroso.com/collect: "true"
    spec:
      serviceAccountName: hermes2-test-sandbox
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sshd
          image: ghcr.io/cjbarroso/hermes-test-sandbox@sha256:dbd39cd21adf137b0a65b5ff4e18fe45c79341b4747f51b73ca01e53089a7697
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/sandbox-entrypoint"]
          env:
            - name: PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes2-test-sandbox-ssh
                  key: authorized_keys
          ports:
            - name: ssh
              containerPort: 2222
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: workspace
              mountPath: /workspace
            - name: wif-config
              mountPath: /etc/google-wif
              readOnly: true
            - name: google-identity-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
              ephemeral-storage: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              # OpenSSH privilege separation chroots its pre-auth child. Without
              # SYS_CHROOT the listener accepts TCP and immediately resets SSH.
              add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, SYS_CHROOT]
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: hermes2-test-sandbox-config
        - name: workspace
          persistentVolumeClaim:
            claimName: hermes2-test-sandbox-workspace
        - name: wif-config
          configMap:
            name: hermes2-test-sandbox-wif
        - name: google-identity-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: https://iam.googleapis.com/projects/1022456978298/locations/global/workloadIdentityPools/nexoflow-k8s/providers/hermes2
                  expirationSeconds: 3600
                  path: google-identity-token
---
apiVersion: v1
kind: Service
metadata:
  name: hermes2-test-sandbox
  namespace: hermes2
  labels:
    app: hermes2-test-sandbox
spec:
  type: ClusterIP
  selector:
    app: hermes2-test-sandbox
  ports:
    - name: ssh
      port: 22
      targetPort: 2222
      protocol: TCP
