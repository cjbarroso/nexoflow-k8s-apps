# Loki ruler alerting rules — log-based alerts.
# Mounted into the Loki pod at /rules/fake (tenant `fake`, single-tenant Loki)
# via singleBinary.extraVolume* in apps/observability/loki-values.yaml; the ruler
# evaluates them and pushes to the Prometheus Alertmanager, which routes
# severity=warning to Telegram only (low-level first layer) and
# severity=critical to the incident-response AI agent (hermes-incident webhook)
# plus Telegram. Each ConfigMap data key becomes a rule file the ruler picks
# up, so a new group = a new data key below.
#
# Two rule sets:
#   - cnpg-backup.yaml  — CNPG backup/WAL failures (see comments inline).
#   - gemini-access.yaml — Gemini API access health for the AI core (added after
#     the 2026-06-01 incident, where a GCP billing block then a 503 spike stalled
#     ingestion for ~6h and NO existing alert fired — the NATS-backlog/redelivery
#     alerts never tripped because only 4 records were ever in flight, below their
#     >10 / >5 thresholds). This watches the core's own Gemini HTTP results so an
#     access problem pages within ~1-2 min regardless of backlog size.
#
# These COMPLEMENT the metric alert CNPGWALArchivingFailing (prometheus-values):
#   - CNPGBackupFailed: any error logged by the barman-cloud plugin sidecar — this
#     is where base-backup, WAL-archive AND retention failures actually surface
#     (verified by simulating a failed backup 2026-05-30). Catches the gap the
#     metric can't see (failed base/scheduled backups; the plugin doesn't populate
#     backup-status metrics). Source: the plugin-barman-cloud container in hhccia-v2
#     (NOT the operator — the operator only logs backup lifecycle at info level).
#   - CNPGWalArchiveErrorsLog: complementary postgres-side signal — fires when
#     Postgres' own archiver logs "archive command failed".
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alerting-rules
  namespace: observability
data:
  cnpg-backup.yaml: |
    groups:
      - name: cnpg-backup
        rules:
          - alert: CNPGBackupFailed
            expr: sum(count_over_time({namespace="hhccia-v2", container="plugin-barman-cloud"} |= `"level":"error"` [15m])) > 2
            labels:
              severity: critical
            annotations:
              summary: "CNPG backup failing (hhccia-core-db)"
              description: "The barman-cloud plugin logged errors for hhccia-core-db in the last 15m — a base backup, WAL archive, or retention operation to R2 is failing (e.g. bad/expired R2 credentials or unreachable bucket). Check: kubectl -n hhccia-v2 get backups.postgresql.cnpg.io and the plugin-barman-cloud container logs."
              logs: "https://logs.cjbarroso.com/d/cnpg-backup-logs?from=now-6h&to=now"
          - alert: CNPGWalArchiveErrorsLog
            expr: sum(count_over_time({namespace="hhccia-v2", container="postgres"} |= `archive command failed` [10m])) > 0
            labels:
              severity: warning
            annotations:
              summary: "Postgres WAL archiving errors (hhccia-core-db)"
              description: "Postgres logged 'archive command failed' in hhccia-v2 in the last 10m — WAL archiving to R2 is failing. If sustained it breaks PITR/backups (the CNPGWALArchivingFailing metric alert escalates to critical after 15m)."
              logs: "https://logs.cjbarroso.com/d/cnpg-backup-logs?from=now-6h&to=now"
  gemini-access.yaml: |
    groups:
      - name: gemini-access
        rules:
          # WARNING (fast heads-up): the core's calls to Gemini are returning
          # HTTP 4xx/5xx. Catches 403 (billing/permission — the "Lightning
          # dunning decision is deny" block seen on 2026-06-01), 429 (quota) and
          # 503 (model overload). httpx logs one line per call:
          #   httpx HTTP Request: POST https://generativelanguage.googleapis.com/...:generateContent "HTTP/1.1 403 Forbidden"
          # so we match the Gemini host + a 4xx/5xx status. Threshold > 3 in 5m
          # (not > 0) so a single transient 503 that auto-recovers on retry does
          # NOT page — a real access problem produces dozens/min and still fires
          # within ~1-2 min. Lower to > 0 if you want every blip. (Validated
          # 2026-06-01: the billing+503 incident logged ~100 errors/h.)
          - alert: GeminiAccessErrors
            expr: sum(count_over_time({namespace="hhccia-v2", container="hhccia-core"} |= `generativelanguage.googleapis.com` |~ `HTTP/1.1 [45]` [5m])) > 3
            labels:
              severity: warning
            annotations:
              summary: "Errores de acceso a Gemini (hhccia-core)"
              description: "El core recibió >3 respuestas HTTP 4xx/5xx desde generativelanguage.googleapis.com en los últimos 5m — falla de acceso a Gemini (403 billing/permiso, 429 cuota, 503 sobrecarga). Si se sostiene, el procesamiento IA se detiene y los registros caen a dead-letter (ver alerta GeminiRecordsDeadLettered)."
              dashboard: "https://logs.cjbarroso.com/d/gemini-health?from=now-6h&to=now"
              logs: "https://logs.cjbarroso.com/d/gemini-health?from=now-6h&to=now"
          # --- Dead-letter, two layers (sized from a 14-day log analysis, 2026-08) ---
          # Observed pattern: ~1 event/day of 1-3 dead-lettered records per blip
          # (never >3/hour, never two consecutive hours), ALL self-healed via the
          # adapter's 5m re-feed. ~85% were JSONDecodeError ("Expecting ','
          # delimiter") — Gemini emitting malformed/truncated JSON that fails
          # parsing after retries; the rest were PermanentError 429
          # RESOURCE_EXHAUSTED (monthly spend cap) / 403. A single `> 0` critical
          # alert was therefore pure noise. The split below keeps a cheap human
          # heads-up for every blip and reserves the incident-response agent for
          # signals that historically never self-heal. Routing (prometheus-values
          # alertmanager): warning -> Telegram only; critical -> hermes-incident
          # (AI agent) + Telegram.
          # LAYER 1 — WARNING (Telegram only): any record parked in
          # hhccia.records.discovered.deadletter. No `for:` — it's a cheap
          # heads-up, ~1/day at current noise levels.
          - alert: GeminiRecordsDeadLettered
            expr: sum(count_over_time({namespace="hhccia-v2", container="hhccia-core"} |= `dead-lettering` [10m])) > 0
            labels:
              severity: warning
            annotations:
              summary: "Dead-letter (aviso) — registros parqueados en hhccia-core"
              description: "El core parqueó registros en hhccia.records.discovered.deadletter en los últimos 10m. Históricamente es un blip transitorio (~85% JSONDecodeError por JSON malformado de Gemini) que se recupera solo con el re-feed del adapter (~5m). Escala a crítico solo si persiste (GeminiRecordsDeadLetteredSustained) o viene en volumen (GeminiRecordsDeadLetteredBurst)."
              dashboard: "https://logs.cjbarroso.com/d/gemini-health?from=now-6h&to=now"
              logs: "https://logs.cjbarroso.com/d/gemini-health?from=now-6h&to=now"
          # LAYER 2a — CRITICAL "long time" (AI agent): fresh dead-letters keep
          # appearing in every 10m window for 30m straight. A transient blip
          # slides out of the window in <=10m, so this can only fire when Gemini
          # (or the payload stream) genuinely keeps failing across multiple 5m
          # adapter re-feed cycles — the historical blips never reached this.
          - alert: GeminiRecordsDeadLetteredSustained
            expr: sum(count_over_time({namespace="hhccia-v2", container="hhccia-core"} |= `dead-lettering` [10m])) > 0
            for: 30m
            labels:
              severity: critical
            annotations:
              summary: "Dead-letter SOSTENIDO 30m — ingesta IA detenida, investigar causa raíz"
              description: "Registros siguen cayendo a hhccia.records.discovered.deadletter desde hace >=30m (el re-feed del adapter ya corrió varias veces sin recuperarse): la ingesta IA está perdiendo registros de forma sostenida. Diagnóstico inicial: kubectl -n hhccia-v2 logs deploy/hhccia-core | grep dead-lettering — JSONDecodeError repetido = Gemini devolviendo JSON malformado (modelo/sobrecarga); PermanentError 429 = cuota mensual agotada; 403 = billing/bloqueo del proyecto GCP."
              dashboard: "https://logs.cjbarroso.com/d/gemini-health?from=now-6h&to=now"
              logs: "https://logs.cjbarroso.com/d/gemini-health?from=now-6h&to=now"
          # LAYER 2b — CRITICAL "many errors" (AI agent): >5 dead-letter events
          # in 10m. The 14-day noise ceiling was 3 events/hour, so a burst this
          # size means many records failing at once — an event worth an agent.
          - alert: GeminiRecordsDeadLetteredBurst
            expr: sum(count_over_time({namespace="hhccia-v2", container="hhccia-core"} |= `dead-lettering` [10m])) > 5
            labels:
              severity: critical
            annotations:
              summary: "Dead-letter en VOLUMEN (>5 en 10m) — ingesta IA cayendo en bloque"
              description: ">5 eventos de dead-letter en 10m en hhccia.records.discovered.deadletter (el ruido histórico nunca pasó de 3/hora): muchos registros están fallando a la vez. Diagnóstico inicial: kubectl -n hhccia-v2 logs deploy/hhccia-core | grep dead-lettering — JSONDecodeError masivo = respuestas corruptas de Gemini; PermanentError 429 = cuota mensual agotada; 403 = billing/bloqueo del proyecto GCP."
              dashboard: "https://logs.cjbarroso.com/d/gemini-health?from=now-6h&to=now"
              logs: "https://logs.cjbarroso.com/d/gemini-health?from=now-6h&to=now"
