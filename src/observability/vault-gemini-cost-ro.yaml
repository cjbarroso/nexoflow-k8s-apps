# Vault-sourced `gemini-cost-ro` for the observability stack (VSO migration
# batch 3). This Secret was previously hand-created (it existed in no manifest)
# â€” recreating it by hand after a cluster rebuild was the recovery gap. VSO now
# materializes it from Vault KV v2 at nexoflow/observability/gemini-cost-ro.
#
# Consumed by Grafana via envValueFrom GEMINI_COST_DB_PASSWORD
# (apps/observability/grafana-values.yaml).
#
# Auth is per-namespace (Kubernetes auth role `observability` bound to SA
# default in ns observability; policy observability-ro = read on
# nexoflow/data/observability/*). Other observability SealedSecrets stay as-is.
#
# The CA cert is PUBLIC material (cert-manager cluster CA from
# src/vault/tls.yaml) â€” safe to commit; see docs/10-VAULT-RUNBOOK.md.
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-ca
  namespace: observability
type: Opaque
data:
  ca.crt: 
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: default
  namespace: observability
spec:
  address: https://vault-active.vault.svc.cluster.local:8200
  caCertSecretRef: vault-ca
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: observability
  namespace: observability
spec:
  method: kubernetes
  mount: kubernetes
  # Explicit ref required by VSO 1.5.0 (allow-default-globals): without it the
  # lookup fails with "VaultConnection default not found". See runbook.
  vaultConnectionRef: default
  kubernetes:
    role: observability
    serviceAccount: default
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: gemini-cost-ro
  namespace: observability
spec:
  type: kv-v2
  mount: nexoflow
  path: observability/gemini-cost-ro
  refreshAfter: 1h
  vaultAuthRef: observability
  destination:
    name: gemini-cost-ro
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: grafana
