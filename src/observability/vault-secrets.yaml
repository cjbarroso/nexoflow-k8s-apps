# Vault-sourced secrets for the observability namespace.
#
# Namespace stack (VaultConnection/VaultAuth/vault-ca) plus one
# VaultStaticSecret per Kubernetes Secret; data lives in Vault KV v2 under
# nexoflow/observability/*. Auth is per-namespace (Kubernetes auth role
# `observability` bound to SA default in ns observability; policy
# observability-ro = read on nexoflow/data/observability/*).
#
# gemini-cost-ro was previously hand-created (recovery gap) â€” now declarative.
# The other five replaced same-named SealedSecrets (batch 3/4, 2026-08-21).
# Remaining hand-made secrets in this namespace are out of scope here.
#
# The CA cert is PUBLIC material (cert-manager cluster CA from
# src/vault/tls.yaml) â€” safe to commit; see docs/10-VAULT-RUNBOOK.md.
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-ca
  namespace: observability
type: Opaque
data:
  ca.crt: 
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: default
  namespace: observability
spec:
  address: https://vault-active.vault.svc.cluster.local:8200
  caCertSecretRef: vault-ca
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: observability
  namespace: observability
spec:
  method: kubernetes
  mount: kubernetes
  # Explicit ref required by VSO 1.5.0 (allow-default-globals): without it the
  # lookup fails with "VaultConnection default not found". See runbook.
  vaultConnectionRef: default
  kubernetes:
    role: observability
    serviceAccount: default
    audiences:
      - vault
---
# Read-only Postgres password for the Gemini-cost datasource. Consumed by
# Grafana via envValueFrom GEMINI_COST_DB_PASSWORD (grafana-values.yaml).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: gemini-cost-ro
  namespace: observability
spec:
  type: kv-v2
  mount: nexoflow
  path: observability/gemini-cost-ro
  refreshAfter: 1h
  vaultAuthRef: observability
  destination:
    name: gemini-cost-ro
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: grafana
---
# Grafana admin + Authentik OIDC client (chart: grafana.admin.existingSecret
# and envValueFrom GF_AUTH_GENERIC_OAUTH_*).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: grafana-secrets
  namespace: observability
spec:
  type: kv-v2
  mount: nexoflow
  path: observability/grafana-secrets
  refreshAfter: 1h
  vaultAuthRef: observability
  destination:
    name: grafana-secrets
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: grafana
---
# Read-only Postgres role for the Authentik datasource (Grafana users/logins
# dashboards). Consumed via envValueFrom AUTHENTIK_DB_PASSWORD.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: authentik-grafana-ro
  namespace: observability
spec:
  type: kv-v2
  mount: nexoflow
  path: observability/authentik-grafana-ro
  refreshAfter: 1h
  vaultAuthRef: observability
  destination:
    name: authentik-grafana-ro
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: grafana
---
# Telegram bot token for the Gemini-cost alert contact point AND Alertmanager's
# notify receiver (same bot; referenced, never duplicated).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: alertmanager-notify
  namespace: observability
spec:
  type: kv-v2
  mount: nexoflow
  path: observability/alertmanager-notify
  refreshAfter: 1h
  vaultAuthRef: observability
  destination:
    name: alertmanager-notify
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: grafana
    - kind: StatefulSet
      name: prometheus-alertmanager
---
# Bearer token Alertmanager uses when calling the hermes2 incident webhook.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: alertmanager-incident-bearer
  namespace: observability
spec:
  type: kv-v2
  mount: nexoflow
  path: observability/alertmanager-incident-bearer
  refreshAfter: 1h
  vaultAuthRef: observability
  destination:
    name: alertmanager-incident-bearer
    create: true
  rolloutRestartTargets:
    - kind: StatefulSet
      name: prometheus-alertmanager
---
# healthchecks.io ping URL for Prometheus heartbeat alerts.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: prometheus-hc-ping
  namespace: observability
spec:
  type: kv-v2
  mount: nexoflow
  path: observability/prometheus-hc-ping
  refreshAfter: 1h
  vaultAuthRef: observability
  destination:
    name: prometheus-hc-ping
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: prometheus-server
