# Vault-sourced secrets for authentik (VSO migration batch 4).
#
# Replaces the two former SealedSecrets AND adopts the hand-created
# `authentik-secrets` (which existed in no manifest â€” a recovery gap, now
# declarative in Vault KV v2 at nexoflow/authentik/*).
#
# Consumers:
# - authentik-db-app: CNPG Cluster bootstrap (postgres-cnpg.yaml). Needed at
#   bootstrap; after a full cluster rebuild it materializes once Vault+VSO are
#   up and Argo re-syncs.
# - authentik-db-backup-creds: barman ObjectStore for CNPG WAL backups.
# - authentik-secrets: env/envFrom for deployments authentik-server/worker.
#
# The CA cert is PUBLIC material (cert-manager cluster CA from
# src/vault/tls.yaml) â€” safe to commit; see docs/10-VAULT-RUNBOOK.md.
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-ca
  namespace: authentik
type: Opaque
data:
  ca.crt: 
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: default
  namespace: authentik
spec:
  address: https://vault-active.vault.svc.cluster.local:8200
  caCertSecretRef: vault-ca
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: authentik
  namespace: authentik
spec:
  method: kubernetes
  mount: kubernetes
  # Explicit ref required by VSO 1.5.0 (allow-default-globals): without it the
  # lookup fails with "VaultConnection default not found". See runbook.
  vaultConnectionRef: default
  kubernetes:
    role: authentik
    serviceAccount: default
    audiences:
      - vault
---
# CNPG bootstrap credentials (Cluster.spec.bootstrap.initdb.secret).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: authentik-db-app
  namespace: authentik
spec:
  type: kv-v2
  mount: nexoflow
  path: authentik/db-app
  refreshAfter: 1h
  vaultAuthRef: authentik
  destination:
    name: authentik-db-app
    create: true
---
# S3/R2 credentials for CNPG WAL archiving + base backups.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: authentik-db-backup-creds
  namespace: authentik
spec:
  type: kv-v2
  mount: nexoflow
  path: authentik/db-backup-creds
  refreshAfter: 1h
  vaultAuthRef: authentik
  destination:
    name: authentik-db-backup-creds
    create: true
---
# App secrets: secret key, bootstrap admin, DB credentials for the app env.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: authentik-secrets
  namespace: authentik
spec:
  type: kv-v2
  mount: nexoflow
  path: authentik/authentik-secrets
  refreshAfter: 1h
  vaultAuthRef: authentik
  destination:
    name: authentik-secrets
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: authentik-server
    - kind: Deployment
      name: authentik-worker
