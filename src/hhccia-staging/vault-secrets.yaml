# Vault-sourced secrets for hhccia-staging (VSO migration batch 4).
#
# Replaces the former SealedSecret `hhccia-core-secrets`; data lives in Vault
# KV v2 at nexoflow/hhccia-staging/core-secrets. Auth is per-namespace
# (Kubernetes auth role `hhccia-staging` bound to SA default; policy
# hhccia-staging-ro = read on nexoflow/data/hhccia-staging/*). The CNPG-managed
# db-app secret (hhccia-staging-db-app) is generated by the operator, not by us.
#
# The CA cert is PUBLIC material (cert-manager cluster CA from
# src/vault/tls.yaml) â€” safe to commit; see docs/10-VAULT-RUNBOOK.md.
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-ca
  namespace: hhccia-staging
type: Opaque
data:
  ca.crt: 
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: default
  namespace: hhccia-staging
spec:
  address: https://vault-active.vault.svc.cluster.local:8200
  caCertSecretRef: vault-ca
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: hhccia-staging
  namespace: hhccia-staging
spec:
  method: kubernetes
  mount: kubernetes
  # Explicit ref required by VSO 1.5.0 (allow-default-globals): without it the
  # lookup fails with "VaultConnection default not found". See runbook.
  vaultConnectionRef: default
  kubernetes:
    role: hhccia-staging
    serviceAccount: default
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: hhccia-core-secrets
  namespace: hhccia-staging
spec:
  type: kv-v2
  mount: nexoflow
  path: hhccia-staging/core-secrets
  refreshAfter: 1h
  vaultAuthRef: hhccia-staging
  destination:
    name: hhccia-core-secrets
    create: true
